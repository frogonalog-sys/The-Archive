<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a140f; --panel:#231b14; --line:#3a2d21; --fg:#ece0c6; --muted:#a08e72;
  --accent:#b8925a; --accent-dim:#6e5533; --wine:#6e1f24;
  --display:'Cormorant Garamond', Georgia, serif;
  --mono:'EB Garamond', Georgia, serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}
/* film grain */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* header */
header{padding:48px 0 20px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
h1{font-family:'UnifrakturMaguntia', var(--display);font-weight:400;font-size:clamp(58px,13vw,160px);line-height:1;font-weight:400;letter-spacing:-.01em;margin:10px 0 10px}
h1 em{font-style:normal;font-weight:400;color:var(--accent)}
h1 span{color:var(--accent)}
.sub{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}

/* nav */
nav{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--muted);font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.12em;padding:14px 18px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--fg)}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}

/* controls */
.controls{position:sticky;top:0;z-index:20;background:rgba(26,20,15,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-family:var(--mono);font-size:16px;font-style:italic;padding:9px 12px;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;padding:7px 11px;cursor:pointer;text-transform:uppercase}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.fav.on{background:var(--wine);border-color:var(--wine);color:var(--fg)}
.jump{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{font-family:var(--display);font-weight:600;font-size:19px;min-width:26px;text-align:center;padding:2px 0;color:var(--fg)}
.jump a:hover{color:var(--accent)}
.jump a.off{color:#4a3c2e;pointer-events:none}
.stats{font-size:13px;letter-spacing:.12em;font-style:italic;color:var(--muted);text-transform:uppercase;margin-top:10px}
.stats b{color:var(--fg);font-weight:500}

/* letter sections */
section.letter{padding:36px 0 8px;scroll-margin-top:150px}
.lhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px}
.lhead .L{font-family:var(--display);font-style:italic;font-weight:500;font-size:104px;line-height:.75;color:var(--accent)}
.lhead .rule{flex:1;height:5px;border-top:1px solid var(--accent-dim);border-bottom:1px solid var(--accent-dim);margin-bottom:10px}
.lhead .n{font-size:14px;font-style:italic;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.card{position:relative;cursor:default}
.cover{position:relative;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.35);overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:sepia(.25) saturate(.85) contrast(1.02);transition:opacity .4s, filter .25s, transform .25s}
.card.loaded .cover img{opacity:1}
.card:hover .cover img{filter:none;transform:scale(1.03)}
.ph{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(circle at 30% 25%,#2d2219,#1d160f 70%)}
.ph .pa{font-family:var(--display);font-style:italic;font-weight:600;font-size:24px;line-height:1;color:var(--accent);word-break:break-word}
.ph .pt{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.card.loaded .ph{display:none}
.star{position:absolute;top:0;right:0;z-index:2;background:var(--wine);color:var(--fg);font-size:12px;padding:3px 7px}
.meta{padding-top:8px}
.artist{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1;margin-top:2px;word-break:break-word}
.yr{display:flex;gap:8px;align-items:center;font-size:14px;font-style:italic;color:var(--muted);margin-top:4px}
.tag{border:1px solid var(--accent-dim);color:var(--accent);font-style:normal;font-size:10px;letter-spacing:.12em;padding:0 5px}

/* queue + empty */
.queue{margin:56px 0 0;padding:24px 0;border-top:1px solid var(--line)}
.queue h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:44px}
.queue h2 span{color:var(--accent)}
.queue ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.queue li{border:1px solid var(--line);padding:5px 11px;font-size:15px;font-style:italic;color:var(--muted)}
.empty{padding:80px 0;text-align:center}
.empty .big{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(48px,10vw,110px);color:var(--accent-dim)}
.empty p{color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
.paper{--fg:#1d1712;--muted:#76695a;--line:#e4ddd1;--panel:#f4f0e9;--accent:#8a6838;--accent-dim:#cdb894;
  background:#fff;color:var(--fg);padding-bottom:48px}
.paper .ph{background:var(--panel)}
.paper .cover{box-shadow:0 4px 12px rgba(40,25,10,.12)}
.paper .queue{margin-top:40px}
footer{padding:40px 0 60px;font-size:13px;letter-spacing:.2em;font-style:italic;color:#5c4b38;text-transform:uppercase}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:18px 12px}
  .lhead .L{font-size:80px}
  header{padding-top:32px}
}
</style>
</head>

<script>
(() => {
  const TYPE_LABEL = {EP:"EP", CP:"COMP", BS:"B-SIDES", GH:"HITS", LV:"LIVE"};
  const strip = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const sortName = a => strip(a).replace(/^(the|a|an)\s+/i, "").toLowerCase();
  const letterOf = a => { const c = sortName(a).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; };
  const yearNum = y => parseInt(y, 10) || 0;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const data = RECORDS.map(r => ({...r, type:(r.type || "LP").toUpperCase(), _s:sortName(r.artist), _L:letterOf(r.artist)}))
    .sort((a,b) => a._s.localeCompare(b._s) || yearNum(a.year) - yearNum(b.year) || a.title.localeCompare(b.title));

  const $ = id => document.getElementById(id);
  let filter = "all", query = "";

  /* ---------- cover art (iTunes Search API, cached in browser) ---------- */
  const norm = s => strip(s).toLowerCase().replace(/[^a-z0-9]/g, "");
  const cacheGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const cacheSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };

  async function findCover(r) {
    if (r.cover) return r.cover;
    const key = "cover:" + r.artist + "|" + r.title;
    const hit = cacheGet(key);
    if (hit) return hit === "none" ? null : hit;
    try {
      const term = encodeURIComponent(r.artist + " " + r.title);
      const res = await fetch(`https://itunes.apple.com/search?term=${term}&entity=album&limit=15`);
      const j = await res.json();
      const a = norm(r.artist).slice(0, 6), t = norm(r.title);
      const byArtist = (j.results || []).filter(x => norm(x.artistName).includes(a));
      const best = byArtist.find(x => norm(x.collectionName) === t)
                || byArtist.find(x => norm(x.collectionName).startsWith(t))
                || byArtist[0];
      const url = best ? best.artworkUrl100.replace("100x100bb", "600x600bb") : null;
      cacheSet(key, url || "none");
      return url;
    } catch { return null; } // offline / blocked: don't cache, try again next visit
  }

  let active = 0; const pending = [];
  const enqueue = fn => { pending.push(fn); pump(); };
  function pump() {
    while (active < 4 && pending.length) {
      active++;
      pending.shift()().finally(() => { active--; pump(); });
    }
  }
  const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const card = e.target, r = card._rec;
      enqueue(() => findCover(r).then(url => {
        if (!url) return;
        const img = card.querySelector("img");
        img.onload = () => card.classList.add("loaded");
        img.src = url;
      }));
    });
  }, {rootMargin:"300px"}) : null;

  /* ---------- render ---------- */
  function matches(r) {
    if (filter === "fav" && !r.fav) return false;
    if (["LP","EP","CP"].includes(filter) && r.type !== filter) return false;
    if (!query) return true;
    const hay = norm(r.artist + " " + r.title + " " + r.year);
    return hay.includes(norm(query));
  }

  function card(r) {
    const el = document.createElement("article");
    el.className = "card";
    el._rec = r;
    el.innerHTML = `
      <div class="cover">
        ${r.fav ? '<div class="star">★</div>' : ""}
        <div class="ph"><div class="pa">${esc(r.artist)}</div><div class="pt">${esc(r.title)}</div></div>
        <img alt="${esc(r.artist)} — ${esc(r.title)}" loading="lazy">
      </div>
      <div class="meta">
        <div class="artist">${esc(r.artist)}</div>
        <div class="title">${esc(r.title)}</div>
        <div class="yr"><span>${esc(r.year || "—")}</span>${r.type !== "LP" ? `<span class="tag">${TYPE_LABEL[r.type] || esc(r.type)}</span>` : ""}</div>
      </div>`;
    if (io) io.observe(el);
    return el;
  }

  function render() {
    const list = $("list"); list.innerHTML = "";
    const shown = data.filter(matches);
    const groups = {};
    shown.forEach(r => (groups[r._L] ||= []).push(r));
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#".split("");

    $("jump").innerHTML = letters.map(L =>
      `<a href="#L-${L === "#" ? "num" : L}" class="${groups[L] ? "" : "off"}">${L}</a>`).join("");

    letters.filter(L => groups[L]).forEach(L => {
      const sec = document.createElement("section");
      sec.className = "letter";
      sec.id = "L-" + (L === "#" ? "num" : L);
      sec.innerHTML = `<div class="lhead"><div class="L">${L}</div><div class="rule"></div><div class="n">${String(groups[L].length).padStart(2,"0")}</div></div><div class="grid"></div>`;
      const grid = sec.querySelector(".grid");
      groups[L].forEach(r => grid.appendChild(card(r)));
      list.appendChild(sec);
    });

    if (!shown.length) list.innerHTML = `<div class="empty"><div class="big">Nothing</div><p>no records match</p></div>`;

    const artists = new Set(shown.map(r => r.artist)).size;
    const favs = shown.filter(r => r.fav).length;
    $("stats").innerHTML = `<b>${shown.length}</b> records · <b>${artists}</b> artists · <b>${favs}</b> ★`;
  }

  $("queue").innerHTML = `<h2>On Queue<span>.</span></h2><ul>${
    [...QUEUE].sort((a,b) => sortName(a).localeCompare(sortName(b))).map(b => `<li>${esc(b)}</li>`).join("")}</ul>`;

  /* ---------- controls ---------- */
  $("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
    render();
  });
  $("nav").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("nav button").forEach(n => n.classList.toggle("on", n === b));
    const isRec = b.dataset.tab === "records";
    $("records-view").hidden = !isRec;
    $("other-view").hidden = isRec;
    $("other-title").textContent = b.textContent;
  });

  render();
})();
</script>
</body>
</html>
