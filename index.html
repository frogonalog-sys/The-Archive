<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ARCHIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a140f; --panel:#231b14; --line:#3a2d21; --fg:#ece0c6; --muted:#a08e72;
  --accent:#b8925a; --accent-dim:#6e5533; --wine:#6e1f24;
  --display:'Cormorant Garamond', Georgia, serif;
  --mono:'EB Garamond', Georgia, serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* header */
header{padding:48px 0 20px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
h1{font-family:'UnifrakturMaguntia', var(--display);font-weight:400;font-size:clamp(58px,13vw,160px);line-height:1;font-weight:400;letter-spacing:-.01em;margin:10px 0 10px}
h1 em{font-style:normal;font-weight:400;color:var(--accent)}
h1 span{color:var(--accent)}
.sub{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}

/* nav */
nav{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--muted);font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.12em;padding:14px 18px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:var(--fg)}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}

/* controls */
.controls{position:sticky;top:0;z-index:20;background:rgba(26,20,15,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-family:var(--mono);font-size:16px;font-style:italic;padding:9px 12px;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;padding:7px 11px;cursor:pointer;text-transform:uppercase}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.fav.on{background:var(--wine);border-color:var(--wine);color:var(--fg)}
.jump{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{font-family:var(--display);font-weight:600;font-size:19px;min-width:26px;text-align:center;padding:2px 0;color:var(--fg)}
.jump a:hover{color:var(--accent)}
.jump a.off{color:#4a3c2e;pointer-events:none}
.stats{font-size:13px;letter-spacing:.12em;font-style:italic;color:var(--muted);text-transform:uppercase;margin-top:10px}
.stats b{color:var(--fg);font-weight:500}

/* letter sections */
section.letter{padding:36px 0 8px;scroll-margin-top:240px}
.lhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px}
.lhead .L{font-family:var(--display);font-style:italic;font-weight:500;font-size:104px;line-height:.75;color:var(--accent)}
.lhead .rule{flex:1;height:5px;border-top:1px solid var(--accent-dim);border-bottom:1px solid var(--accent-dim);margin-bottom:10px}
.lhead .n{font-size:14px;font-style:italic;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.card{position:relative;cursor:default}
.cover{position:relative;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.35);overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.card.loaded .cover img{opacity:1}
.ph{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(circle at 30% 25%,#2d2219,#1d160f 70%)}
.ph .pa{font-family:var(--display);font-style:italic;font-weight:600;font-size:24px;line-height:1;color:var(--accent);word-break:break-word}
.ph .pt{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.card.loaded .ph{display:none}
.star{position:absolute;top:0;right:0;z-index:2;background:var(--wine);color:var(--fg);font-size:12px;padding:3px 7px}
.meta{padding-top:8px}
.artist{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1;margin-top:2px;word-break:break-word}
.yr{display:flex;gap:8px;align-items:center;font-size:14px;font-style:italic;color:var(--muted);margin-top:4px}
.tag{border:1px solid var(--accent-dim);color:var(--accent);font-style:normal;font-size:10px;letter-spacing:.12em;padding:0 5px}

/* queue + empty */
.queue{margin:56px 0 0;padding:24px 0;border-top:1px solid var(--line)}
.queue h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:44px}
.queue h2 span{color:var(--accent)}
.queue ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.queue li{border:1px solid var(--line);padding:5px 11px;font-size:15px;font-style:italic;color:var(--muted)}
.empty{padding:80px 0;text-align:center}
.empty .big{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(48px,10vw,110px);color:var(--accent-dim)}
.empty p{color:var(--muted);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
.paper{--fg:#1d1712;--muted:#76695a;--line:#e4ddd1;--panel:#f4f0e9;--accent:#8a6838;--accent-dim:#cdb894;
  background:#fff;color:var(--fg);padding-bottom:48px}
.paper .ph{background:var(--panel)}
.paper .cover{box-shadow:0 4px 12px rgba(40,25,10,.12)}
.paper .queue{margin-top:40px}
footer{padding:40px 0 60px;font-size:13px;letter-spacing:.2em;font-style:italic;color:#5c4b38;text-transform:uppercase}
@media (max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:18px 12px}
  .lhead .L{font-size:80px}
  header{padding-top:32px}
}

/* sort / filter selects */
.sel{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sel select{background:var(--panel);color:var(--fg);border:1px solid var(--line);font-family:var(--mono);font-size:15px;font-style:italic;padding:7px 10px;outline:none;cursor:pointer}
.sel select:focus{border-color:var(--accent)}
.row2{margin-top:10px;justify-content:space-between}
.row2 .stats{margin-top:0}
.yr .dot{opacity:.5}
.yr .genre{font-style:normal;font-size:12px;letter-spacing:.06em}
.lhead .L.word{font-size:clamp(44px,7vw,72px);line-height:.95}
.jump.words{flex-wrap:wrap;gap:2px 16px;overflow:visible}
.jump.words a{flex:none;min-width:0;font-size:15px;padding:2px 0;white-space:nowrap}

/* clickable cards */
.card{cursor:pointer}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.cover{transition:transform .25s ease, box-shadow .25s ease}
.card:hover .cover{transform:translateY(-4px);box-shadow:0 12px 22px rgba(40,25,10,.22)}

/* ---------- album popup ---------- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(20,14,9,.72);backdrop-filter:blur(3px);animation:fade .25s ease}
.sheet{position:relative;width:min(1060px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#fbf8f2;color:#1d1712;
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
.x{position:absolute;top:8px;right:12px;z-index:5;background:none;border:0;font-size:34px;line-height:1;color:#76695a;cursor:pointer;font-family:var(--display)}
.x:hover{color:#1d1712}

.stagecol{background:#1b140e}
.stage{position:sticky;top:0;height:min(720px,calc(100vh - 48px));display:flex;align-items:center;justify-content:center;padding:48px 28px;
  background:radial-gradient(circle at 40% 45%,#2a2018,#17110c 75%)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;background:rgba(251,248,242,.08);border:1px solid rgba(236,224,198,.18);color:#ece0c6;
  width:34px;height:34px;font-size:22px;line-height:1;cursor:pointer;font-family:var(--display)}
.nav:hover{background:rgba(251,248,242,.18)}
.nav.prev{left:10px}.nav.next{right:10px}

.record{position:relative;width:min(300px,52%);aspect-ratio:1;margin-right:26%}
.sleeve{position:absolute;inset:0;z-index:2;background:#2d2219;box-shadow:0 18px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04)}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.sleeve-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;text-align:center;
  font-family:var(--display);font-style:italic;font-weight:600;font-size:26px;color:#b8925a}
.disc{position:absolute;top:3%;left:3%;width:94%;height:94%;z-index:1;transform:translateX(0);transition:transform 1.1s cubic-bezier(.25,.9,.3,1)}
.record.out .disc{transform:translateX(52%)}
.spin{position:absolute;inset:0;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.record.out .spin{animation:spin 2.4s linear infinite;animation-delay:1s}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl{position:absolute;inset:0;border-radius:50%;background:#111}
.grooves{position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.22) 0 1px,rgba(255,255,255,.035) 1px 2px,transparent 2px 3.2px);
  -webkit-mask:radial-gradient(circle,transparent 0 33%,#000 34% 97%,transparent 97.5%);mask:radial-gradient(circle,transparent 0 33%,#000 34% 97%,transparent 97.5%)}
.sheen{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.22) 14%,transparent 22% 55%,rgba(255,255,255,.16) 62%,transparent 70%)}
.label{position:absolute;inset:33%;border-radius:50%;overflow:hidden;background:#c9b48d;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.label img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 50%}
.disc.see-through .spin{box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.12)}
.disc.see-through .vinyl{backdrop-filter:blur(2px)}
.record.reallabel .hole{opacity:.0}
.record.photo .label,.record.photo .hole{display:none}
.record.photo .grooves{opacity:.45}
.record.pressed .grooves{opacity:.3}
.hole{position:absolute;left:50%;top:50%;width:3.2%;height:3.2%;transform:translate(-50%,-50%);border-radius:50%;background:#17110c;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}

.info{padding:40px 36px 36px;font-family:var(--mono);font-size:16px;line-height:1.5}
.info .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#76695a}
.info h2{font-family:var(--display);font-weight:600;font-size:clamp(32px,4vw,46px);line-height:1.02;margin:6px 0 10px}
.info .metaline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.pill{border:1px solid #cdb894;color:#6e5533;font-size:13px;padding:1px 9px;font-style:italic}
.pill.fav{background:#6e1f24;border-color:#6e1f24;color:#ece0c6;font-style:normal}
.info h3{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#8a6838;
  margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid #e4ddd1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 18px}
.facts dt{color:#76695a;font-style:italic}
.facts dd{margin:0}
.tracks{list-style:none;counter-reset:t;columns:1}
.tracks li{display:flex;gap:10px;padding:3px 0;border-bottom:1px dotted #e4ddd1;break-inside:avoid}
.tracks li .n{color:#a08e72;min-width:22px;font-variant-numeric:tabular-nums}
.tracks li .t{flex:1}
.tracks li .d{color:#76695a;font-variant-numeric:tabular-nums}
.tracks .disc-h{color:#8a6838;font-style:italic;border:0;padding-top:8px}
.pressings{list-style:none}
.pressings li{padding:6px 0;border-bottom:1px dotted #e4ddd1;font-size:15px}
.pressings li b{font-weight:500}
.pressings .psub{color:#76695a;font-style:italic;font-size:14px}
.swatches{display:flex;gap:6px;margin:4px 0 2px}
.swatches i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #cdb894;padding:5px 10px;color:#6e5533}
.links a:hover{background:#1d1712;color:#fbf8f2;border-color:#1d1712}
.muted{color:#a08e72;font-style:italic}
.loading{color:#a08e72;font-style:italic;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.notes{font-size:17px;line-height:1.6;white-space:pre-wrap}
.rating{color:#6e1f24;letter-spacing:.1em}
body.locked{overflow:hidden}

@media (max-width:760px){
  .modal{padding:0;align-items:stretch}
  .sheet{grid-template-columns:1fr;max-height:100vh;height:100%}
  .stage{position:relative;height:auto;padding:42px 16px 30px}
  .record{width:min(220px,50%);margin-right:24%}
  .info{padding:24px 20px 40px}
  .x{color:#ece0c6}
  .x:hover{color:#fff}
  .row .sel{flex:1 1 140px}
  .sel select{flex:1}
}
@media (prefers-reduced-motion:reduce){
  .disc{transition:none}.record.out .spin{animation:none}
}

/* ---------- record store ---------- */
.bins{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.bins::-webkit-scrollbar{display:none}
.bin{flex:none;background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.08em;padding:7px 12px;cursor:pointer;white-space:nowrap}
.bin small{font-family:var(--mono);font-style:italic;font-weight:400;font-size:12px;opacity:.7;margin-left:6px;letter-spacing:0}
.bin:hover{color:var(--fg);border-color:var(--muted)}
.bin.on{background:var(--accent);border-color:var(--accent);color:#1a140f}
.yr .genre{background:none;border:0;padding:0;font:inherit;font-style:normal;font-size:12px;letter-spacing:.06em;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.yr .genre:hover{color:var(--accent)}
.tagbar{display:flex;align-items:center;gap:10px;margin:20px 0 0;font-size:14px;font-style:italic;color:var(--muted)}
.tagbar b{font-style:normal;font-family:var(--display);font-weight:600;font-size:20px;color:var(--fg)}
.tagbar button{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;cursor:pointer}
.tagbar button:hover{color:var(--fg);border-color:var(--muted)}
section.bin-sec{padding:44px 0 8px;scroll-margin-top:260px}
.shead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;border-bottom:2px solid var(--fg);padding-bottom:10px}
.shead .S{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,54px);line-height:.95;letter-spacing:.01em}
.shead .n{margin-left:auto;font-size:14px;font-style:italic;letter-spacing:.1em;color:var(--muted)}
.shead .sub2{font-size:13px;font-style:italic;color:var(--muted);margin-bottom:4px}
/* plastic artist divider tabs */
.divider{position:relative;aspect-ratio:1;align-self:start;margin-top:14px;cursor:default}
.divider .tabtop{position:absolute;top:-14px;left:10%;height:22px;padding:0 12px;max-width:80%;background:#efe6d2;border:1px solid #cdb894;border-bottom:0;border-radius:6px 6px 0 0;
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a3a26}
.divider .plate{position:absolute;inset:6px 0 0;background:linear-gradient(160deg,#f4ecdb,#e6d9bd);border:1px solid #cdb894;box-shadow:0 4px 12px rgba(40,25,10,.1);
  display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.divider .plate b{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.2vw,28px);line-height:1;color:#2b2016;word-break:break-word}
.divider .plate i{font-size:12px;color:#8a6838;margin-top:6px}
/* store moments */
.moments{padding-top:26px}
.moment{margin:30px 0 8px}
.mhead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.mhead h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(30px,4.5vw,46px);line-height:1}
.mhead h2 span{color:var(--accent)}
.mhead p{font-size:13px;font-style:italic;color:var(--muted)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:16px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:thin}
.rail .card .newtag{position:absolute;top:0;left:0;z-index:2;background:#1d1712;color:#fbf8f2;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;padding:3px 7px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 20px}
.pick{position:relative}
.pick .note{position:relative;margin:14px 8px 0;z-index:3;background:#fff7c9;padding:12px 12px 10px;transform:rotate(-1.6deg);box-shadow:0 6px 14px rgba(40,25,10,.16);
  font-family:'Caveat',cursive;font-size:21px;line-height:1.1;color:#2b2016}
.pick:nth-child(even) .note{transform:rotate(1.4deg);background:#ffe9d6}
.pick .note::before{content:"";position:absolute;top:-8px;left:50%;width:56px;height:16px;transform:translateX(-50%) rotate(2deg);background:rgba(220,210,180,.7)}
.pick .note .sig{display:block;text-align:right;font-size:18px;color:#8a6838;margin-top:4px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 18px;background:#1b140e;padding:26px;border:1px solid #2d2219}
.vitem{cursor:pointer;text-align:center}
.vdisc{position:relative;aspect-ratio:1;border-radius:50%;background:#111;box-shadow:0 10px 24px rgba(0,0,0,.5);overflow:hidden;transition:transform .5s ease}
.vitem:hover .vdisc{transform:rotate(25deg) scale(1.03)}
.vdisc .g{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,rgba(0,0,0,.16) 0 1px,rgba(255,255,255,.03) 1px 2px,transparent 2px 3.2px)}
.vdisc.pressed .g,.vdisc.clear .g{opacity:.25}
.vdisc .sh{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.2) 14%,transparent 22% 55%,rgba(255,255,255,.14) 62%,transparent 70%)}
.vdisc .lb{position:absolute;inset:33%;border-radius:50%;background:#c9b48d center/cover no-repeat;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.vdisc .hl{position:absolute;left:50%;top:50%;width:4%;height:4%;transform:translate(-50%,-50%);border-radius:50%;background:#1b140e}
.vitem .vt{margin-top:10px;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1;color:#ece0c6}
.vitem .va{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a08e72;margin-top:2px}
@media (max-width:520px){.picks{grid-template-columns:repeat(2,1fr)}.wall{padding:16px;gap:18px 12px}}

/* ---------- real bins ---------- */
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 26px;padding:8px 0 20px}
.crate{position:relative;padding:0 18px;outline:none;isolation:isolate;z-index:0}

<script>
(() => {
  const TYPE_LABEL = {EP:"EP", CP:"COMP", BS:"B-SIDES", GH:"HITS", LV:"LIVE"};
  const TYPE_LONG  = {LP:"Studio album", EP:"EP", CP:"Compilation", BS:"B-sides", GH:"Greatest hits", LV:"Live album"};
  const strip = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
  const sortName = a => strip(a).replace(/^(the|a|an)\s+/i, "").toLowerCase();
  const letterOf = a => { const c = sortName(a).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; };
  const yearNum = y => parseInt(y, 10) || 0;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm = s => strip(s).toLowerCase().replace(/[^a-z0-9]/g, "");
  const slug = s => "S-" + norm(s || "x");
  const keyOf = r => r.artist + " — " + r.title;
  const $ = id => document.getElementById(id);

  // each artist gets one home bin: hand-placed, or whichever bin most of their genre tags point to
  const HOME = {};
  (() => {
    const tally = {};
    RECORDS.forEach(r => { const sec = GENRE_SECTION[r.genre] || "Rock / Alternative"; (tally[r.artist] ||= {})[sec] = (tally[r.artist][sec] || 0) + (r.genre ? 1 : 0.1); });
    for (const a in tally) HOME[a] = ARTIST_SECTION[a] || Object.entries(tally[a]).sort((x, y) => y[1] - x[1] || SECTION_ORDER.indexOf(x[0]) - SECTION_ORDER.indexOf(y[0]))[0][0];
  })();
  const secIdx = s => { const i = SECTION_ORDER.indexOf(s); return i < 0 ? 99 : i; };
  const data = RECORDS.map(r => ({...r, type:(r.type || "LP").toUpperCase(), _s:sortName(r.artist), _L:letterOf(r.artist), _sec:HOME[r.artist]}));
  const ORDERED = new Set(SPECIAL_ORDERS.map(x => x.trim()));
  let filter = "all", query = "", sortBy = "store", genreSel = "all", bin = "all", shownList = [];

  /* ---------- small helpers ---------- */
  const cacheGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const cacheSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const WEEK = 7 * 864e5, MONTH = 30 * 864e5;

  // fetch JSON, waiting and retrying if the service says "slow down"
  let pauseUntil = 0;
  async function getJSON(url, tries = 4) {
    for (let i = 0; i < tries; i++) {
      const wait = pauseUntil - Date.now();
      if (wait > 0) await sleep(wait);
      const res = await fetch(url);
      if (res.ok) return res.json();
      if (res.status === 403 || res.status === 429 || res.status === 503) { pauseUntil = Date.now() + 3000 * (i + 1); continue; }
      throw new Error("HTTP " + res.status);
    }
    throw new Error("rate limited");
  }

  // MusicBrainz allows ~1 request per second, so these run one at a time
  let mbChain = Promise.resolve();
  function mb(path) {
    const job = mbChain.then(async () => { await sleep(1100); return getJSON("https://musicbrainz.org/ws/2/" + path + (path.includes("?") ? "&" : "?") + "fmt=json"); });
    mbChain = job.catch(() => {});
    return job;
  }

  /* ---------- cover art (saved list first, then Apple Music, then MusicBrainz) ---------- */
  function pickITunes(results, r) {
    const a = norm(r.artist).slice(0, 6), t = norm(r.title);
    const byArtist = (results || []).filter(x => norm(x.artistName).includes(a));
    return byArtist.find(x => norm(x.collectionName) === t)
        || byArtist.find(x => norm(x.collectionName).startsWith(t) && t.length > 1)
        || (t.length > 3 ? byArtist.find(x => norm(x.collectionName).includes(t)) : null);
  }
  async function fromITunes(r) {
    const j = await getJSON(`https://itunes.apple.com/search?term=${encodeURIComponent(r.artist + " " + r.title)}&entity=album&limit=25`);
    const best = pickITunes(j.results, r);
    return best ? best.artworkUrl100.replace("100x100bb", "300x300bb") : null;
  }
  async function mbGroup(r) {
    const q = encodeURIComponent(`releasegroup:"${r.title.replace(/"/g, "")}" AND artist:"${r.artist.replace(/"/g, "")}"`);
    const j = await mb(`release-group/?query=${q}&limit=8`);
    const gs = j["release-groups"] || [], t = norm(r.title), a = norm(r.artist).slice(0, 6);
    const ok = g => (g["artist-credit"] || []).some(c => norm(c.name || c.artist?.name).includes(a));
    const yr = String(yearNum(r.year) || "");
    return (yr && gs.find(g => ok(g) && norm(g.title) === t && (g["first-release-date"] || "").startsWith(yr)))
        || gs.find(g => ok(g) && norm(g.title) === t && /album|ep/i.test(g["primary-type"] || ""))
        || gs.find(g => ok(g) && norm(g.title) === t)
        || gs.find(ok) || null;
  }
  async function findCover(r) {
    const key = "cover2:" + r.artist + "|" + r.title;
    const hit = cacheGet(key);
    if (hit && hit.url) return hit.url;
    if (hit && hit.none && Date.now() - hit.t < WEEK) return null;
    let url = null, failed = false;
    try { url = await fromITunes(r); } catch { failed = true; }
    if (!url) { try { const g = await mbGroup(r); if (g) url = `https://coverartarchive.org/release-group/${g.id}/front-250`; } catch { failed = true; } }
    if (url) cacheSet(key, {url});
    else if (!failed) cacheSet(key, {none:true, t:Date.now()});
    return url;
  }
  const coverOf = r => r.cover || SAVED_COVERS[keyOf(r)] || (cacheGet("cover2:" + r.artist + "|" + r.title) || {}).url || null;

  let active = 0; const pending = [];
  function pump() {
    while (active < 4 && pending.length) {
      active++;
      pending.shift()().catch(() => {}).finally(() => { active--; pump(); });
    }
  }
  const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const card = e.target, r = card._rec;
      pending.push(() => findCover(r).then(url => { if (url) setImg(card, url, r); })); pump();
    });
  }, {rootMargin:"600px"}) : null;
  function setImg(card, url, r) {
    const img = card.querySelector("img");
    img.onload = () => card.classList.add("loaded");
    img.onerror = () => { try { localStorage.removeItem("cover2:" + r.artist + "|" + r.title); } catch {} };
    img.src = url;
  }

  /* ---------- sorting + grouping ---------- */
  const decade = r => { const y = yearNum(r.year); return y ? Math.floor(y / 10) * 10 + "s" : "Undated"; };
  const SORTS = {
    store:  { cmp:(a,b) => secIdx(a._sec) - secIdx(b._sec) || a._s.localeCompare(b._s) || yearNum(a.year) - yearNum(b.year) || a.title.localeCompare(b.title), group:r => r._sec, letters:false, bins:true },
    artist: { cmp:(a,b) => a._s.localeCompare(b._s) || yearNum(a.year) - yearNum(b.year) || a.title.localeCompare(b.title), group:r => r._L, letters:true },
    title:  { cmp:(a,b) => sortName(a.title).localeCompare(sortName(b.title)) || a._s.localeCompare(b._s), group:r => letterOf(r.title), letters:true },
    new:    { cmp:(a,b) => yearNum(b.year) - yearNum(a.year) || a._s.localeCompare(b._s), group:decade },
    old:    { cmp:(a,b) => yearNum(a.year) - yearNum(b.year) || a._s.localeCompare(b._s), group:decade },
    genre:  { cmp:(a,b) => (a.genre || "~").localeCompare(b.genre || "~") || a._s.localeCompare(b._s) || yearNum(a.year) - yearNum(b.year), group:r => r.genre || "Other" },
  };

  function matches(r) {
    if (filter === "fav" && !r.fav) return false;
    if (filter === "own" && !r.own) return false;
    if (["LP","EP","CP"].includes(filter) && r.type !== filter) return false;
    if (genreSel !== "all" && (r.genre || "") !== genreSel) return false;
    if (bin !== "all" && r._sec !== bin) return false;
    if (!query) return true;
    return norm(r.artist + " " + r.title + " " + r.year + " " + (r.genre || "")).includes(norm(query));
  }

  function card(r) {
    const el = document.createElement("article");
    el.className = "card";
    el._rec = r;
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", `${r.artist} — ${r.title}, open details`);
    el.innerHTML = `
      <div class="cover">
        ${r.fav ? '<div class="star">★</div>' : ""}
        ${r.own ? '<div class="nfs-tag">NOT<br>FOR<br>SALE</div>' : (ORDERED.has(keyOf(r)) ? '<div class="ord-tag">ON ORDER</div>' : "")}
        <div class="ph"><div class="pa">${esc(r.artist)}</div><div class="pt">${esc(r.title)}</div></div>
        <img alt="" loading="lazy">
      </div>
      <div class="meta">
        <div class="artist">${esc(r.artist)}</div>
        <div class="title">${esc(r.title)}</div>
        <div class="yr"><span>${esc(r.year || "—")}</span>${r.genre ? `<span class="dot">·</span><button type="button" class="genre" data-tag="${esc(r.genre)}" title="See every ${esc(r.genre)} record">${esc(r.genre)}</button>` : ""}${r.type !== "LP" ? `<span class="tag">${TYPE_LABEL[r.type] || esc(r.type)}</span>` : ""}</div>
      </div>`;
    const known = coverOf(r);
    if (known) setImg(el, known, r); else if (io) io.observe(el);
    el.addEventListener("click", e => {
      const t = e.target.closest("[data-tag]");
      if (t) { e.stopPropagation(); setTag(t.dataset.tag); return; }
      openAlbum(r);
    });
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openAlbum(r); } });
    return el;
  }

  function render() {
    const S = SORTS[sortBy];
    const list = $("list"); list.innerHTML = "";
    shownList = data.filter(matches).sort(S.cmp);
    const groups = new Map();
    shownList.forEach(r => { const g = S.group(r); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r); });

    const letterMode = S.letters;
    const jump = $("jump");
    jump.classList.toggle("words", !letterMode);
    if (letterMode) {
      jump.innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#".split("").map(L =>
        `<a href="#${slug(L === "#" ? "num" : L)}" class="${groups.has(L) ? "" : "off"}">${L}</a>`).join("");
    } else {

  async function albumInfo(r) {

      <h3>Release</h3><div id="m-release" class="loading">Looking it up…</div>
      <h3>Tracklist</h3><div id="m-tracks" class="loading">Loading tracks…</div>
      <h3>On Vinyl</h3><div id="m-vinylinfo" class="loading">Finding pressings…</div>
      <h3>My Notes</h3>
      ${r.notes || r.rating ? `${stars ? `<div class="rating">${stars}</div>` : ""}<div class="notes">${esc(r.notes || "")}</div>` : `<p class="muted">No notes yet.</p>`}
    `;

    albumInfo(r).then(info => {
      if (token !== openToken) return;
      const len = (info.tracks || []).reduce((s, t) => s + (t.ms || 0), 0);
      const facts = [
        ["Released", fmtDate(info.firstDate) || fmtDate(info.apple?.date) || r.year],
        ["Label", info.label || (info.apple?.copyright || "").replace(/^[℗©]\s*\d{4}\s*/, "")],
        ["Tracks", info.tracks?.length || ""],
        ["Length", len ? fmtLong(len) : ""],
      ].filter(f => f[1]);
      const rel = $("m-release"); rel.className = "";
      rel.innerHTML = facts.length ? `<dl class="facts">${facts.map(f => `<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join("")}</dl>` : `<p class="muted">Couldn't find release details.</p>`;

      const tr = $("m-tracks"); tr.className = "";
      if (info.tracks && info.tracks.length) {
        const multi = new Set(info.tracks.map(t => t.disc)).size > 1;
        let lastDisc = 0, html = "";
        for (const t of info.tracks) {
          if (multi && t.disc !== lastDisc) { html += `<li class="disc-h">Disc ${t.disc}</li>`; lastDisc = t.disc; }
          html += `<li><span class="n">${esc(t.n)}</span><span class="t">${esc(t.title)}</span><span class="d">${fmtTime(t.ms)}</span></li>`;
        }
        tr.innerHTML = `<ol class="tracks">${html}</ol>`;
      } else tr.innerHTML = `<p class="muted">Tracklist not found.</p>`;

      const vi = $("m-vinylinfo"); vi.className = "";
      const v = info.vinyl || [];
      const q = encodeURIComponent(r.artist + " " + r.title);
      const links = `<div class="links">
          <a href="https://www.discogs.com/search/?q=${q}&type=master" target="_blank" rel="noopener">Discogs</a>
          ${info.mbid ? `<a href="https://musicbrainz.org/release-group/${info.mbid}" target="_blank" rel="noopener">MusicBrainz</a>` : ""}
          ${info.apple?.url ? `<a href="${esc(info.apple.url)}" target="_blank" rel="noopener">Apple Music</a>` : ""}
        </div>`;
      const sw = `<div class="k" style="margin-top:2px">Colors pulled from the cover</div><div class="swatches">${(current._colors || []).map(x => `<i style="background:${x}"></i>`).join("")}</div>`;
      if (v.length) {
        const first = v[0];
        const variants = [...new Set(v.map(x => x.note).filter(n => /\b(colou?red|clear|splatter|marbled?|red|blue|green|white|pink|purple|yellow|orange|gold|silver|smoke|transparent|translucent|picture disc|vinyl variant|swirl|galaxy|black ice|half)\b/i.test(n)))].slice(0, 8);
        const rows = v.slice(0, 6).map(x => `<li><b>${esc((x.date || "").slice(0,4) || "Undated")}</b>${x.country ? " · " + esc(country(x.country)) : ""} · ${esc(x.fmt)}
            <div class="psub">${esc([x.label, x.cat].filter(Boolean).join(" — "))}${x.note ? " · " + esc(x.note) : ""}</div></li>`).join("");
        vi.innerHTML = `
          <dl class="facts">
            <dt>First on vinyl</dt><dd>${esc(fmtDate(first.date) || "Unknown date")}${first.country ? ", " + esc(country(first.country)) : ""}</dd>
            ${first.label ? `<dt>Label</dt><dd>${esc(first.label)}${first.cat ? ` <span class="muted">(${esc(first.cat)})</span>` : ""}</dd>` : ""}
            <dt>Pressings</dt><dd>${v.length} vinyl release${v.length === 1 ? "" : "s"} catalogued</dd>
            ${variants.length ? `<dt>Variants</dt><dd>${variants.map(esc).join(", ")}</dd>` : ""}
          </dl>
          ${sw}
          <h3 style="margin-top:16px">Pressings</h3><ul class="pressings">${rows}</ul>
          ${v.length > 6 ? `<p class="muted" style="margin-top:6px">+ ${v.length - 6} more on Discogs / MusicBrainz</p>` : ""}
          ${links}`;
      } else {
        vi.innerHTML = `<p class="muted">No vinyl pressings catalogued yet.</p>${sw}${links}`;
      }
    });
  }
  function closeAlbum() {
    openToken++;
    $("modal").hidden = true; document.body.classList.remove("locked");
    $("m-record").classList.remove("out");
  }
  function step(dir) {
    if (!current) return;
    const i = shownList.indexOf(current);
    if (i < 0) return;
    openAlbum(shownList[(i + dir + shownList.length) % shownList.length]);
  }
  $("modal").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeAlbum(); });
  $("m-prev").addEventListener("click", () => step(-1));
  $("m-next").addEventListener("click", () => step(1));
  document.addEventListener("keydown", e => {
    if ($("modal").hidden) return;
    if (e.key === "Escape") closeAlbum();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
  });

  /* ---------- controls ---------- */
  const genres = [...new Set(data.map(r => r.genre).filter(Boolean))].sort();
  $("genre").insertAdjacentHTML("beforeend", genres.map(g => `<option>${esc(g)}</option>`).join(""));
  $("queue").innerHTML = `<h2>On Queue<span>.</span></h2><ul>${
    [...QUEUE].sort((a,b) => sortName(a).localeCompare(sortName(b))).map(b => `<li>${esc(b)}</li>`).join("")}</ul>`;
  $("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
  $("sort").addEventListener("change", e => { sortBy = e.target.value; render(); });
  $("genre").addEventListener("change", e => { genreSel = e.target.value; render(); });
  $("bins").addEventListener("click", e => {
    const b = e.target.closest(".bin"); if (!b) return;
    bin = b.dataset.bin;
    if (sortBy !== "store") { sortBy = "store"; $("sort").value = "store"; }
    render();
    $("list").scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
    render();
  });
  $("nav").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("nav button").forEach(n => n.classList.toggle("on", n === b));
    const isRec = b.dataset.tab === "records";
    $("records-view").hidden = !isRec;
    $("other-view").hidden = isRec;
    $("other-title").textContent = b.textContent;
  });

  render();
})();
</script>
</body>
</html>
